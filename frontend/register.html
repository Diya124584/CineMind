<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>Register | CineMind</title>

<link rel="stylesheet" href="css/style.css">

<link rel="stylesheet" href="css/auth.css">

</head>

<body>

<div class="auth-container">

<div class="auth-card">

<h1>Create Account</h1>

<form id="registerForm">

<input
id="username"
placeholder="Username"
required
>

<input
type="email"
id="email"
placeholder="Email"
required>

<input
type="password"
id="password"
placeholder="Password"
required>

<button>

Register

</button>

</form>

<p>

Already have an account?

<a href="login.html">

Login

</a>

</p>

</div>

</div>

<script type="module" src="js/auth.js"></script>

</body>

</html>
